name: Sync to Production (CityUPedia)

# 验证后合并到正式版：手动触发，把测试版 main 的内容同步到正式版 v1.0（Pages 部署分支）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync CityUPediaTest main -> CityUPedia v1.0
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python tools/cross_repo_sync.py --src CityUPediaTest --src-ref main --dst CityUPedia --dst-ref v1.0 --direction test_to_prod
