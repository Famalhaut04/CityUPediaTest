  <link rel="stylesheet" href="assets/styles.css?v=20260807a">
  <style>
    /* 问卷专用样式 */
    .survey-page { max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }

    .survey-hero {
      text-align: center;
      margin-bottom: 36px;
      padding: 36px 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }
    .survey-hero .hero-logo {
      width: 60px; height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(99,102,241,0.25);
    }
    .survey-hero h1 {
      font-size: 26px; font-weight: 900;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .survey-hero p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .survey-section {
      margin-bottom: 32px;
      padding: 28px 26px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }
    .survey-section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary-soft);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .survey-section-title .num {
      display: inline-grid;
      place-items: center;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 13px;
      flex-shrink: 0;
    }

    .survey-field { margin-bottom: 20px; }
    .survey-field:last-child { margin-bottom: 0; }
    .survey-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .survey-label .required { color: #e53e3e; margin-left: 2px; }
    .survey-hint {
      font-size: 12px;
      color: var(--faint);
      margin-bottom: 8px;
    }

    .survey-input,
    .survey-select,
    .survey-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 200ms, box-shadow 200ms;
      box-sizing: border-box;
    }
    .survey-input:focus,
    .survey-select:focus,
    .survey-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .survey-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    .survey-radio-group,
    .survey-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .survey-radio-item,
    .survey-checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: all 180ms;
      font-size: 13px;
      color: var(--muted);
      user-select: none;
    }
    .survey-radio-item:hover,
    .survey-checkbox-item:hover {
      border-color: var(--primary-border);
      color: var(--ink);
    }
    .survey-radio-item input,
    .survey-checkbox-item input {
      margin: 0;
      accent-color: var(--primary);
    }
    .survey-radio-item:has(input:checked),
    .survey-checkbox-item:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    /* 星级评分 */
    .star-rating { display: flex; gap: 4px; }
    .star-rating input { display: none; }
    .star-rating label {
      font-size: 28px;
      color: #ddd;
      cursor: pointer;
      transition: color 150ms;
      line-height: 1;
    }
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input:checked ~ label {
      color: #f5a623;
    }
    .star-rating .stars-wrap { display: flex; flex-direction: row-reverse; gap: 4px; }

    .survey-submit-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 20px;
      margin-top: 8px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .survey-btn {
      padding: 12px 32px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 200ms;
      font-family: inherit;
    }
    .survey-btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 6px 18px rgba(99,102,241,0.35);
    }
    .survey-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.45); }
    .survey-btn-secondary {
      background: var(--card);
      color: var(--primary);
      border: 1.5px solid var(--primary-border);
    }
    .survey-btn-secondary:hover { background: var(--primary-soft); }

    .survey-result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .survey-result-overlay.show { display: flex; }
    .survey-result-card {
      width: 100%;
      max-width: 560px;
      padding: 32px 28px;
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .survey-result-card h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .survey-result-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .survey-result-box {
      width: 100%;
      min-height: 200px;
      max-height: 300px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }
    .survey-result-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .survey-page { padding: 20px 14px 60px; }
      .survey-section { padding: 20px 16px; }
      .survey-hero { padding: 24px 18px; }
      .survey-hero h1 { font-size: 22px; }
    }
  </style>
</head>

  <script src="assets/shared.js?v=20260807a"></script>
  <script>
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function getCheckedValues(name) {
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
    }

    function getLabelForValue(name, value) {
      const el = document.querySelector(`input[name="${name}"][value="${value}"]`);
      return el ? el.parentElement.textContent.trim() : value;
    }

    function getRatingStars(name) {
      const checked = document.querySelector(`input[name="${name}"]:checked`);
      if (!checked) return '未评分';
      const score = parseInt(checked.value);
      return '★'.repeat(score) + '☆'.repeat(5 - score) + ` (${score}/5)`;
    }

    function getProgrammeLabel() {
      const checked = document.querySelector('input[name="programme"]:checked');
      if (!checked) return '未填写';
      return checked.parentElement.textContent.trim();
    }

    document.getElementById('survey-form').addEventListener('submit', function(e) {
      e.preventDefault();

      // 校验必填项
      const programme = document.querySelector('input[name="programme"]:checked');
      const enrollment = document.querySelector('input[name="enrollment"]:checked');
      const overallRating = document.querySelector('input[name="overall_rating"]:checked');
      const recommend = document.querySelector('input[name="recommend"]:checked');

      if (!programme) { showToast('请选择你的硕士项目'); return; }
      if (!enrollment) { showToast('请选择入学年份'); return; }
      if (!overallRating) { showToast('请给整体体验评分'); return; }
      if (!recommend) { showToast('请选择是否推荐'); return; }

      const lines = [];
      lines.push('═════════════════════════════════');
      lines.push('  CityU 选课助手 · 用户反馈');
      lines.push('  提交时间：' + new Date().toLocaleString('zh-CN'));
      lines.push('═════════════════════════════════');
      lines.push('');
      lines.push('【基本信息】');
      lines.push('硕士项目：' + getProgrammeLabel());
      lines.push('入学年份：' + (enrollment.value === '2026' ? '2026 秋季入学' : '2025 或更早'));
      const devices = getCheckedValues('device');
      lines.push('使用设备：' + (devices.length ? devices.map(d => ({pc:'电脑',tablet:'平板',phone:'手机'})[d]).join('、') : '未填写'));
      lines.push('');
      lines.push('【整体评价】');
      lines.push('整体体验：' + getRatingStars('overall_rating'));
      lines.push('界面设计：' + getRatingStars('ui_rating'));
      lines.push('数据准确性：' + getRatingStars('data_rating'));
      lines.push('推荐意愿：' + (recommend ? getLabelForValue('recommend', recommend.value) : '未填写'));
      lines.push('');
      lines.push('【功能反馈】');
      const bestFeatures = getCheckedValues('best_feature');
      const bestLabels = {cascade:'三级级联选择', timetable:'可视化课表规划', conflict:'时间冲突检测', reviews:'课程评价与口碑分', syllabus:'课程PDF与中文翻译', i18n:'中英文切换', credits:'学分统计'};
      lines.push('最好用的功能：' + (bestFeatures.length ? bestFeatures.map(f => bestLabels[f]).join('、') : '未填写'));
      const improveFeatures = getCheckedValues('improve_feature');
      const improveLabels = {cascade:'三级级联选择', timetable:'课表规划', conflict:'冲突检测', reviews:'课程评价', syllabus:'课程PDF与翻译', search:'搜索与筛选', mobile:'移动端适配'};
      lines.push('需改进的功能：' + (improveFeatures.length ? improveFeatures.map(f => improveLabels[f]).join('、') : '未填写'));
      const newFeatures = getCheckedValues('new_feature');
      const newLabels = {export:'课表导出', share:'课表分享链接', more_reviews:'更多课程评价', professor:'教授评价', grade:'成绩分布参考', notification:'选课开放提醒', darkmode:'深色模式'};
      lines.push('希望新增的功能：' + (newFeatures.length ? newFeatures.map(f => newLabels[f]).join('、') : '未填写'));
      lines.push('');
      lines.push('【问题与建议】');
      lines.push('遇到的Bug：');
      lines.push(document.querySelector('textarea[name="bugs"]').value || '无');
      lines.push('');
      lines.push('课程数据问题：');
      lines.push(document.querySelector('textarea[name="data_error"]').value || '无');
      lines.push('');
      lines.push('其他建议：');
      lines.push(document.querySelector('textarea[name="suggestion"]').value || '无');
      lines.push('');
      lines.push('联系方式：' + (document.querySelector('input[name="contact"]').value || '未填写'));
      lines.push('');
      lines.push('═════════════════════════════════');

      document.getElementById('result-text').value = lines.join('\n');
      document.getElementById('result-overlay').classList.add('show');
    });

    function copyResult() {
      const text = document.getElementById('result-text');
      text.select();
      text.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast('已复制到剪贴板');
      } catch (err) {
        showToast('复制失败，请手动选择复制');
      }
    }

    function closeResult() {
      document.getElementById('result-overlay').classList.remove('show');
    }
  </script>
</body>
</html>
