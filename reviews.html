    <main class="main-content reviews-main">
      <header class="top-bar">
        <div class="page-title-wrap">
          <h1 class="top-title" data-i18n="reviews.title">课程评价中心</h1>
          <p class="top-subtitle" data-i18n="reviews.desc">按学院与院系浏览课程，查看所有使用者的共享评价，也可以直接为心仪的课程提交评价。</p>
        </div>
        <div class="top-bar-right">
          <div class="intro-stats" id="reviews-stats" aria-label="评价中心统计">
            <div><strong id="stat-courses">—</strong><span id="stat-courses-label" data-i18n="reviews.statCourses">课程总数</span></div>
            <div><strong id="stat-reviews">—</strong><span id="stat-reviews-label" data-i18n="reviews.statReviews">评价总数</span></div>
            <div><strong id="stat-avg">—</strong><span id="stat-avg-label" data-i18n="reviews.statAvg">平均评分</span></div>
          </div>
        </div>
      </header>

      <section class="reviews-filter" aria-label="学院与院系筛选">
        <div class="reviews-filter-inner">
          <label class="reviews-filter-item" for="college-select">
            <span class="cascade-label" data-i18n="college.label">学院</span>
            <select id="college-select" class="reviews-select"></select>
          </label>
          <label class="reviews-filter-item" for="department-select">
            <span class="cascade-label" data-i18n="department.label">院系</span>
            <select id="department-select" class="reviews-select"></select>
          </label>
        </div>
        <div class="reviews-search">
          <label class="search-box reviews-search-box" for="reviews-course-search">
            <span class="sr-only">按课程代码搜索</span>
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="reviews-course-search" type="search" placeholder="搜索课程代码，如 CS5487" autocomplete="off">
          </label>
        </div>
      </section>

      <section class="reviews-course-area" id="reviews-course-area" aria-label="课程列表与评价">
        <div class="notice source-empty" id="reviews-course-empty">请先选择学院与院系，即可查看该系的课程列表。</div>
        <div id="reviews-course-list" class="reviews-course-list"></div>
      </section>
